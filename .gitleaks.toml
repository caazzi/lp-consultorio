# gitleaks configuration — https://github.com/gitleaks/gitleaks
#
# Extends the default rules (which already catch Google service accounts, OAuth
# client secrets, AWS keys, etc.) and adds an EXPLICIT allowlist for this
# repository's known false positives.
#
# Principle: MINIMAL allowlist by REGEX (never by PATH). Never whitelist a whole
# file — a file that only mentions a field name today may hold a real key
# tomorrow, and a path allowlist would hide exactly that case.

title = "lp-consultorio"

[extend]
useDefault = true

[allowlist]
description = "Known false positives for this site (not credentials)"

# The `client_id` here is the ephemeral per-page-load UUID used by the first-party
# pipeline (netlify/access-store.js) — cookie-less visitor identity. It is NOT an
# OAuth client id. The regex requires a hyphenated UUID v4 so it never opens room
# for free-form secrets.
regexes = [
  '''client_id['":\s]+[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}''',
  '''window\.__clientId''',
  # Literal smoke-test marker (QA), documented in AGENTS.md/test-csp.
  '''TESTGCLID'''
]
