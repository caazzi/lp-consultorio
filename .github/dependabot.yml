# Dependabot config for lp-consultorio
# Single-package-manager (npm) JAMstack site.
# Strategy rationale:
#  - This project is a PRODUCTION-LIVE, security-hardened landing page (strict CSP via netlify.toml)
#    with a custom Tailwind design system. Automatic daily bumps risk breaking the design and
#    flooding the build/preview pipeline, so updates are batched on a WEEKLY cadence.
#  - `ignore` keeps major versions sandboxed until manually tested (esp. Tailwind, which recompiles
#    the shipped CSS and could alter the visual identity). Low-risk grouped updates are batched to
#    reduce noise and blast radius.

version: 2
updates:
  # --- Shared npm ecosystem (runtime + build + scripts) ---
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Maceio"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    labels:
      - "dependencies"
    versioning-strategy: "auto"
    # Group low-risk, closely-related updates into single PRs to protect the pipeline.
    groups:
      netlify:
        patterns:
          - "@netlify/*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Tailwind is compiled into the shipped CSS; a major bump must be tested against the
      # custom design system before auto-merging. Review manually.
      - dependency-name: "tailwindcss"
        versions: [">=4.0.0"]
