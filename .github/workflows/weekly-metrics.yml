# Weekly metrics report — Consultório Salustiano
#
# Runs every Saturday morning (BRT) and emails the first-party funnel
# (Netlify Blobs) plus the GA4 overlay. The number logic lives in
# scripts/weekly-report.js; this YAML only collects, writes the bodies and sends.
#
# Required secrets (Settings > Secrets and variables > Actions):
#   MAIL_USERNAME     your Gmail address (e.g. you@gmail.com)
#   MAIL_PASSWORD     16-character App Password (requires Google 2FA)
#   MAIL_TO           recipient (may be the same as MAIL_USERNAME)
#   GA4_CREDENTIALS   FULL content of ga-credentials.json (service account)
#
# GA4_PROPERTY_ID and ACCESS_INSIGHTS_DAYS are not secrets -> set in `env`.
# The first-party side needs no credential (public insights endpoint).
# If GA4_CREDENTIALS is missing, the report still goes out first-party only.
#
# Scope (AGENTS.md): paid media = infectologia only. Ads (cost/BRL) is NOT part of
# this job because ads/ is local-only (interactive OAuth); for that run
# `npm run ads-report` on your machine.

name: Weekly Metrics Report

on:
  schedule:
    # 11:00 UTC = 08:00 America/Sao_Paulo (Saturday). BRT has no DST since 2019.
    - cron: '0 11 * * 6'
  workflow_dispatch:
    inputs:
      days:
        description: 'Window in days'
        required: false
        default: '7'

permissions:
  contents: read

concurrency:
  group: weekly-metrics
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      GA4_PROPERTY_ID: '493028300'
      ACCESS_INSIGHTS_DAYS: ${{ github.event.inputs.days || '7' }}
      WEEKLY_OUT_DIR: ${{ github.workspace }}/.weekly-report

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # The dependencies (Netlify Blobs) are not needed for the report, but the
      # explicit install matches the lockfile.
      - name: Install dependencies
        run: npm ci --omit=dev

      - name: Materialize GA4 credential
        env:
          GA4_CREDENTIALS: ${{ secrets.GA4_CREDENTIALS }}
        run: |
          set -euo pipefail
          if [ -n "${GA4_CREDENTIALS:-}" ]; then
            printf '%s' "$GA4_CREDENTIALS" > "$RUNNER_TEMP/ga-credentials.json"
            echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/ga-credentials.json" >> "$GITHUB_ENV"
          else
            echo "::warning::GA4_CREDENTIALS missing - the report will be first-party only."
          fi

      - name: Generate report
        id: gen
        run: |
          set -euo pipefail
          mkdir -p "$WEEKLY_OUT_DIR"
          node scripts/weekly-report.js --out "$WEEKLY_OUT_DIR" | tee "$RUNNER_TEMP/report.out"
          test -s "$WEEKLY_OUT_DIR/body.txt" || { echo "corpo de texto vazio"; exit 1; }
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: ${{ steps.gen.outputs.ok == '1' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Relatório Salustiano <${{ secrets.MAIL_USERNAME }}>  # lang:allow (email sender)
          to: ${{ secrets.MAIL_TO }}
          subject: "Métricas semanais — Consultório Salustiano"  # lang:allow (email subject)
          html_body: file://${{ github.workspace }}/.weekly-report/body.html
          body: file://${{ github.workspace }}/.weekly-report/body.txt

      # Always publish the report as an artifact, even if the email step fails.
      # `include-hidden-files` is REQUIRED: `.weekly-report` starts with a dot and
      # upload-artifact@v4 skips hidden files/dirs by default - without it the step
      # "passes" while uploading nothing.
      - name: Upload artifact
        if: ${{ always() && steps.gen.outputs.ok == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-report-${{ github.run_id }}
          path: ${{ github.workspace }}/.weekly-report/
          include-hidden-files: true
          retention-days: 30

      # Failure alert. Without it a broken job is SILENT: the report simply does not
      # arrive and nobody knows - exactly what happened on 2026-10-24 (insights 504
      # from a Netlify timeout). Uses the same secrets as the normal send.
      - name: Notify failure by email
        if: ${{ failure() }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Relatório Salustiano <${{ secrets.MAIL_USERNAME }}>  # lang:allow (email sender)
          to: ${{ secrets.MAIL_TO }}
          subject: "Atenção: o relatório de métricas desta semana não foi gerado"  # lang:allow (email subject)
          # lang:allow-block (failure email body)
          body: |
            O relatório automático de métricas desta semana NÃO foi gerado.

            O que fazer: abrir o run abaixo e conferir o step "Generate report".
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Nenhum número foi perdido: os eventos ficam guardados no Netlify Blobs e
            podem ser relidos com `npm run access-logs`, ou o workflow pode ser
            reexecutado depois da correção.
