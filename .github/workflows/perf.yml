# Gate de Web Vitals — roda em todo push/PR e FALHA se o orçamento de
# performance for estourado. Mede o estático de `public/` num servidor local
# (mesmo código do push, antes do deploy), substituindo o RUM que ia para o GA4.
#
# Por que local e não a URL de produção: medir produção avalia o código
# ANTERIOR ao push, não o novo. O estático local pega regressões de HTML/CSS/JS,
# que são o risco real (ex.: gtag eager levou o TBT de ~20ms para 4-6s).
#
# A engine é scripts/lib/perf.js, a mesma do `npm run perf` — sem duplicação.
# Thresholds em scripts/perf-check.js.

name: Perf Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-vitals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lighthouse é baixado sob demanda pelo npx (--yes). Chrome já vem no
      # runner em /usr/bin/google-chrome; o script lib/perf.js o exporta via
      # CHROME_PATH. Sem npm ci: o gate não precisa das deps do projeto.
      - name: Servir public/ em background
        run: |
          set -euo pipefail
          npx --yes serve public -l 4173 >/tmp/serve.log 2>&1 &
          echo $! > /tmp/serve.pid
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ >/dev/null; then echo "serve ok"; exit 0; fi
            sleep 1
          done
          echo "serve não subiu"; cat /tmp/serve.log; exit 1

      - name: Rodar gate de Web Vitals
        env:
          PERF_BASE_URL: http://localhost:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run perf:check

      - name: Parar servidor
        if: always()
        run: |
          if [ -f /tmp/serve.pid ]; then kill "$(cat /tmp/serve.pid)" 2>/dev/null || true; fi

      # Guarda o relatório do Lighthouse para inspeção quando falhar.
      - name: Upload artefatos de perf
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          path: ${{ runner.temp }}/lh-run/
          if-no-files-found: ignore
          retention-days: 14
