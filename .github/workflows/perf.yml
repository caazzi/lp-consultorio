# Web Vitals gate — runs on every push/PR and FAILS when the performance budget is
# exceeded. Measures the static `public/` on a local server (the same code being
# pushed, before deploy), replacing the RUM that used to go to GA4.
#
# Why local instead of the production URL: measuring production evaluates the code
# BEFORE the push, not the new code. The local static build catches HTML/CSS/JS
# regressions, which is the real risk (e.g. eager gtag took TBT from ~20ms to 4-6s).
#
# The engine is scripts/lib/perf.js, the same one used by `npm run perf` - no duplication.
# Thresholds em scripts/perf-check.js.

name: Perf Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-vitals:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Lighthouse is downloaded on demand by npx (--yes). Chrome ships with the
      # runner at /usr/bin/google-chrome; scripts/lib/perf.js exports it through
      # CHROME_PATH. No npm ci: the gate does not need the project dependencies.
      - name: Serve public/ in the background
        run: |
          set -euo pipefail
          npx --yes serve public -l 4173 >/tmp/serve.log 2>&1 &
          echo $! > /tmp/serve.pid
          for _ in $(seq 1 30); do
            if curl -fsS http://localhost:4173/ >/dev/null; then echo "serve ok"; exit 0; fi
            sleep 1
          done
          echo "serve did not start"; cat /tmp/serve.log; exit 1

      - name: Run the Web Vitals gate
        env:
          PERF_BASE_URL: http://localhost:4173
          CHROME_PATH: /usr/bin/google-chrome
        run: npm run perf:check

      - name: Stop the server
        if: always()
        run: |
          if [ -f /tmp/serve.pid ]; then kill "$(cat /tmp/serve.pid)" 2>/dev/null || true; fi

      # Keep the Lighthouse report for inspection when the gate fails.
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ github.run_id }}
          path: ${{ runner.temp }}/lh-run/
          if-no-files-found: ignore
          retention-days: 14
