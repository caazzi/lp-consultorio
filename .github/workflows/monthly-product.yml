# MONTHLY PRODUCT-insights report (behaviour on the site).
#
# Deliberately separate from the weekly CONVERSION email (weekly-metrics.yml):
#   - weekly  -> "how many customers came" (audience: the owner, media decisions)
#   - monthly -> "how people use the site" (audience: you, CRO decisions)
# Mixing the two is what caused confusion before.
#
# Runs on the first Saturday of the month (BRT) and emails the result. The logic
# lives in scripts/product-report.js; this YAML only collects, writes and sends.
#
# Required secrets (the same as the weekly job):
#   MAIL_USERNAME / MAIL_PASSWORD (App Password) / MAIL_TO
#
# Scope (AGENTS.md): web vitals left the browser and became a CI gate
# (.github/workflows/perf.yml); this report covers scroll/attention/buttons.

name: Monthly Product Report

on:
  schedule:
    # Every Saturday at 11:00 UTC (08:00 BRT).
    # The "first Saturday of the month" check runs inside the generation step.
    - cron: '0 11 * * 6'
  workflow_dispatch:
    inputs:
      days:
        description: 'Window in days'
        required: false
        default: '30'

permissions:
  contents: read

concurrency:
  group: monthly-product
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      PRODUCT_REPORT_DAYS: ${{ github.event.inputs.days || '30' }}
      MONTHLY_OUT_DIR: ${{ github.workspace }}/.product-report

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate report
        id: gen
        run: |
          set -euo pipefail
          
          # Safety catch: the cron runs every Saturday, so abort silently when this is
          # a scheduled run that is not the first Saturday of the month (days 1-7).
          if [ "${{ github.event_name }}" = "schedule" ]; then
            DAY=$(date +%d | sed 's/^0*//')
            if [ "$DAY" -gt 7 ]; then
              echo "Today is a Saturday but not the first of the month (day $DAY). Exiting without generating the report."
              exit 0
            fi
          fi

          mkdir -p "$MONTHLY_OUT_DIR"
          node scripts/product-report.js --out "$MONTHLY_OUT_DIR" | tee "$RUNNER_TEMP/report.out"
          test -s "$MONTHLY_OUT_DIR/body.txt" || { echo "corpo de texto vazio"; exit 1; }
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: Send email
        if: ${{ steps.gen.outputs.ok == '1' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Relatório Salustiano <${{ secrets.MAIL_USERNAME }}>  # lang:allow (email sender)
          to: ${{ secrets.MAIL_TO }}
          subject: "Como as pessoas usam o site (mês) — Consultório Salustiano"  # lang:allow (email subject)
          html_body: file://${{ github.workspace }}/.product-report/body.html
          body: file://${{ github.workspace }}/.product-report/body.txt

      - name: Upload artifact
        if: ${{ always() && steps.gen.outputs.ok == '1' }}
        uses: actions/upload-artifact@v4
        with:
          name: monthly-product-${{ github.run_id }}
          path: ${{ github.workspace }}/.product-report/
          include-hidden-files: true
          retention-days: 90
