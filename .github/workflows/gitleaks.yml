# Secret scanning in CI — defence in depth on top of GitHub's native Secret Scanning.
#
# GitHub Secret Scanning + Push Protection are already enabled on this public repo
# (~200 providers, including before the push). This workflow adds a second,
# independent opinion that:
#   - runs on every push/PR (including forks, where push protection does not act);
#   - scans the FULL HISTORY weekly (old/rotated secrets);
#   - uses gitleaks' rule set + entropy, complementary to GitHub's.
#
# Consumes no secrets (runs with the runner's ephemeral token). No npm dependencies.

name: Secret Scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 03:00 UTC — full-history scan, independent of commits.
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gitleaks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Official binary pinned by version + checksum verification (supply chain).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.24.3'
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSL -o /tmp/gitleaks.tar.gz "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o /tmp/gitleaks.sha256 "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep 'linux_x64.tar.gz$' gitleaks.sha256 | sed 's/gitleaks_[^ ]*\.tar\.gz/gitleaks.tar.gz/' | sha256sum -c -)
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Full-history scan. `--redact` keeps the secret out of the public Actions log
      # (the alert still reports file/line/rule).
      - name: Secret scan (full history)
        run: |
          set -euo pipefail
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --log-opts="--all" \
            --redact \
            --verbose
